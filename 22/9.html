<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>testes de situação</title>
    <link rel='stylesheet' href='22,9.css'>
</head>
<body>
    <h1>TESTE DE NACIONALIDADE</h1>
    <p><strong>QUAL SEU ESTADO PARA SABERMOS SUA NACIONALIDADE ?</strong></p>
    <input type="text" id="estado" >
    <input type="button" id="converter" value="ORIGEM" onclick="converte()">
    <div id="mostrar">
    </div>  
    <!--inversão da moeda-->
    <h2><strong>INVERSÃO DA MOEDA</strong></h2>
    <p><strong>QUAL SEU ESTADO PARA SABER QUAL A MOEDA?</strong></p>
    <input type="text" id="valor">
    <input type="button" id="moeda" value="MOEDA" onclick="moeda()">
    <div id="real">
    </div> 

    <h3>PARTE DA CALCULADORA</h3>
    <!--parte da calculadora-->
    <input type="number" id="a1">+
    <input type="number" id="a2">
    <input type="button" id="sm" value="ADICAO" onclick="adicao()">
    <div id="cx"></div>
    <input type="number" id="s1"> -
    <input type="number" id="s2">
    <input type="button" id="sb" value="SUBTRAÇÃO" onclick="subtrair()">
    <div id="CX"></div>
    <input type="number" id="cx1"> /
    <input type="number" id="cx2">
    <input type="button" id="dividir" value="DIVISÃO" onclick="dividir()">
    <div id="divisao" ></div>
    <input type="number" id="c1"> *
    <input type="number" id="c2">
    <input type="button" id="multiplicar" value="MULTIPLICAR" onclick="multiplicar()">
    <div id="multiplicacao"></div>

    <script>
        function converte() {
            var estado = window.document.getElementById("estado");
            var mostrar = window.document.getElementById("mostrar");
          //pegar o texto do input com value e jogar tudo para maiusculo
          var nova = estado.value.toLowerCase().trim();
          //variavel para guardar os paises
          var estados = {
            "mexico" : "Mexicano(A)",
            "brasil" : "Brasileiro(A)",
            "china" : "Chinês(A)",
            "alemanha" :"Alemao(Ã)",
            "espanha" : "Espanhol",
            "canada" : "Canadense"
          };
             
            if(estados[nova]){
                var nov = estados[nova]
            mostrar.innerText = nov ;

             }  else {
                    mostrar.innerText = "Digite algo válido"
                 }

                };

        function moeda() {
            var valor = window.document.getElementById("valor");
            var moeda = window.document.getElementById("real");
            var converter = valor.value.toLowerCase().trim();
             //VARIAVEL CRIADA PARA GUARDAR OS PAISES
            var paises = {
                "brasil":{locale: "pt-BR", currency:"BRL"},
                "estados unidos":{locale: "en-US", currency:"USD"},
                "portugal":{locale: "pt-PT", currency:"EUR"},
                "espanha":{locale: "es-ES", currency:"EUR"},
                "reino unido":{locale: "en-GB", currency:"GBP"},
                "japao":{locale: "ja-JP", currency:"JPY"},
                "Argentina":{locale: "es-AR", currency:"ARS"},
                "canada":{locale: "en-CA", currency:"CAD"},
                "australia":{locale: "en-AU", currency:"AUD"},
                "china":{locale: "zh-CN", currency:"CNY"}
            };
                var valunumerico = 1.00;

            if(paises[converter]){
                var nov= paises[converter]

                moeda.innerText = valunumerico.toLocaleString(nov.locale, {
                    style:"currency",
                    currency: nov.currency
                });
            }else{
                moeda.innerText = "invalido"
            }

        }
    
        function adicao() {
            var a1 = window.document.querySelector("#a1");
            var a2 = window.document.querySelector("#a2");
            var soma = window.document.querySelector("#cx");
            var A1 = Number(a1.value);
            var A2 = Number(a2.value);
            var resultado = A1+A2 
            soma.innerHTML = `A soma entre ${A1} e ${A2} e de ${resultado}`
        }
        function subtrair() {
            var s1 = window.document.querySelector("#s1");
            var s2 = window.document.querySelector("#s2");
            var menos = window.document.querySelector("#CX");
            var S1 = Number(s1.value)
            var S2 = Number(s2.value)
            var resultado = S1-S2
            menos.innerHTML = `A subtração de ${S1} e ${S2} e de ${resultado}`
        }
        function dividir(){
        var cx1 = window.document.getElementById("cx1") 
        var cx2 = window.document.getElementById("cx2")
        var soma = window.document.getElementById("divisao")
        var n1 = Number(cx1.value)
        var n2 = Number(cx2.value)
        var resultado = n1/n2
                 //atençao o ` de ligaçao e diferente
            soma.innerText= `a divisão de ${n1} e ${n2} é igual a ${resultado}`
        }
        function multiplicar() {
            var c1 = window.document.getElementById("c1")
            var c2 = window.document.getElementById("c2")
            var res = window.document.getElementById("multiplicacao")
            var N1 = Number(c1.value)
            var N2 = Number(c2.value)
            var resu = N1*N2
            res.innerText = `O valor da multiplicaçao entre ${N1} e ${N2} é igual a ${resu}` 
        }
</script>
</body>
</html>
